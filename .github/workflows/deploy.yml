name: Build and Push Enterprise Java App to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: 'enterprisejava.azurecr.io'
  IMAGE_NAME: 'enterprise-java-api'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean test

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}"
          COMMIT_SHA="${{ github.sha }}"
          
          docker build -t $IMAGE_URI:latest -t $IMAGE_URI:$COMMIT_SHA .
          
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$COMMIT_SHA
