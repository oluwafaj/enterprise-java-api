trigger:
  branches:
    include:
      - main

variables:
  # Azure DevOps Service Connection name created in Project Settings > Service connections
  azureSubscription: 'ACR-Service-Connection'
  
  # Registry and Image configuration
  dockerRegistryServiceConnection: 'acrservice-connect'
  containerRegistry: 'enterprisejava.azurecr.io'
  imageRepository: 'enterprise-java-api'
  
  # App Service configuration
  webAppName: 'enterprise-java'
  vmImageName: 'ubuntu-latest'

stages:
  # -------------------------------------------------------------------
  # Stage 1: Build Application & Push Docker Image to ACR
  # -------------------------------------------------------------------
  - stage: Build
    displayName: Build and Push Stage
    jobs:
      - job: BuildAndPush
        displayName: Build Java App and Push Image
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Maven@4
            displayName: 'Build with Maven'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean test'
              publishJUnitResults: true

          - task: Docker@2
            displayName: 'Log in to ACR'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: 'Build and Push Image to ACR'
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                latest
                $(Build.BuildId)

  # -------------------------------------------------------------------
  # Stage 2: Deploy to Dev Slot
  # -------------------------------------------------------------------
  - stage: DeployDev
    displayName: 'Deploy to Dev Slot'
    dependsOn: Build
    jobs:
      - deployment: DeployDevJob
        displayName: 'Deploy to enterprise-java/dev'
        environment: 'dev'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Container to Dev Slot'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    slotName: 'dev'
                    imageName: '$(containerRegistry)/$(imageRepository):$(Build.BuildId)'

  # -------------------------------------------------------------------
  # Stage 3: Deploy to Staging Slot
  # -------------------------------------------------------------------
  - stage: DeployStaging
    displayName: 'Deploy to Staging Slot'
    dependsOn: DeployDev
    jobs:
      - deployment: DeployStagingJob
        displayName: 'Deploy to enterprise-java/staging'
        environment: 'staging'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Container to Staging Slot'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    slotName: 'staging'
                    imageName: '$(containerRegistry)/$(imageRepository):$(Build.BuildId)'

  # -------------------------------------------------------------------
  # Stage 4: Deploy to Production Slot
  # -------------------------------------------------------------------
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployProdJob
        displayName: 'Deploy to enterprise-java (Production)'
        environment: 'production'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Container to Production'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(webAppName)
                    imageName: '$(containerRegistry)/$(imageRepository):$(Build.BuildId)'
